<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Latest Updates</title>
    <link rel="stylesheet" href="./styles/blog-post.css">
    <link rel="stylesheet" href="./styles/navbar.css">
</head>
<body>

    <header class="navbar-container">
            <nav class="navbar">
                <div class="navbar-logo">
                    <a href="#"> <img src="./Assets/images/logos/3.png" alt="logo" width="200px" height="200px"></a>
                </div>
                
                <button class="navbar-toggle" id="navbarToggle" aria-label="Toggle navigation">
                    <span class="toggle-icon"></span>
                </button>
                
                <ul class="navbar-menu" id="navbarMenu">
                    <li class="navbar-item"><a href="./index.html" class="navbar-link">Home</a></li>
                    <li class="navbar-item"><a href="./aboutus.html" class="navbar-link">About Us</a></li>
                    <li class="navbar-item"><a href="./projects.html" class="navbar-link">Projects</a></li>
                    <li class="navbar-item"><a href="./care.html" class="navbar-link">Care</a></li>
                    <li class="navbar-item"><a href="./support.html" class="navbar-link">Support</a></li>
                    <li class="navbar-item"><a href="./contacts.html" class="navbar-link">Contact Us</a></li>
                    <li class="navbar-item"><a href="./blog.html" class="navbar-link">Blog</a></li>
                </ul>
            </nav>
        </header>

    <main>
        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb-nav" aria-label="Breadcrumb">
            <div class="breadcrumb-container">
                <a href="blog.html" class="breadcrumb-link">Blog</a>
                <span class="breadcrumb-separator">/</span>
                <span class="breadcrumb-current" id="breadcrumbTitle">Loading...</span>
            </div>
        </nav>

        <!-- Blog Post Container -->
        <article class="blog-post-container" id="blogPostContainer">
            <div class="post-header">
                <div class="post-meta">
                    <span class="post-category" id="postCategory">Category</span>
                    <span class="post-date" id="postDate">Date</span>
                </div>
                <h1 class="post-title" id="postTitle">Blog Post Title</h1>
                <div class="post-author-section">
                    <img src="https://via.placeholder.com/40" alt="Author" class="author-avatar" id="authorAvatar">
                    <div class="author-info">
                        <p class="author-name" id="authorName">Author Name</p>
                        <p class="author-role" id="authorRole">Author Role</p>
                    </div>
                </div>
            </div>

            <!-- Featured Image -->
            <div class="post-featured-image">
                <img src="https://via.placeholder.com/1200x600" alt="Featured Image" id="featuredImage">
            </div>

            <!-- Post Content -->
            <div class="post-content" id="postContent">
                <p>Loading post content...</p>
            </div>

            <!-- Share Section -->
            <div class="post-share">
                <h3>Share this post</h3>
                <div class="share-buttons">
                    <button class="share-btn facebook" aria-label="Share on Facebook" title="Share on Facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </button>
                    <button class="share-btn twitter" aria-label="Share on Twitter" title="Share on Twitter">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23.953 4.57a10 10 0 002.856-3.863c-1.036.49-2.154.82-3.315.987a5.775 5.775 0 00-9.86 5.27 16.456 16.456 0 01-11.915-6.036 5.775 5.775 0 001.79 7.715 5.778 5.778 0 01-2.616-.72v.07a5.778 5.778 0 004.634 5.662 5.805 5.805 0 01-2.605.099 5.78 5.78 0 005.393 4.013 11.589 11.589 0 01-8.666 2.955 16.467 16.467 0 008.964 2.606c10.754 0 16.61-8.906 16.61-16.608 0-.252-.005-.504-.015-.756a11.87 11.87 0 002.908-3.04z"/>
                        </svg>
                    </button>
                    <button class="share-btn linkedin" aria-label="Share on LinkedIn" title="Share on LinkedIn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/>
                        </svg>
                    </button>
                    <button class="share-btn copy" aria-label="Copy link" title="Copy link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </article>

        <!-- Related Posts Section -->
        <section class="related-posts">
            <h2>Related Posts</h2>
            <div class="related-posts-grid" id="relatedPostsGrid">
                <p>Loading related posts...</p>
            </div>
        </section>
    </main>

    <script src="./js/blog-post.js"></script>
    <script src="./js/navbar.js"></script>
</body>
</html>
